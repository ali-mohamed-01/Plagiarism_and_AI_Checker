version: "3.8"
services:
  backend:
    build: ./backend
    container_name: ris_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - RIS_SQLITE=/data/ris_demo.db
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ris_frontend
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
